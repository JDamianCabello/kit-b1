<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sprint de 60 segundos · Kit B1</title>
    <meta name="description" content="Contesta todas las preguntas que puedas en un minuto." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1113" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../icon-180.png" />
    <script>
      // Tema elegido (claro u oscuro) antes de pintar la página, para que no parpadee
      try {
        const t = (JSON.parse(localStorage.getItem("kitb1-v1")) || {}).theme;
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@600&display=swap"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <script type="module" src="../js/pages/sprint.js"></script>
  </head>
  <body data-tab="practicar" data-focus class="has-back">
    <a class="skip" href="#main">Saltar al contenido</a>
    <header class="topbar">
      <div class="topin">
        <div id="back-top">
          <a class="back" href="index.html"><span aria-hidden="true">←</span> Practicar</a>
        </div>
        <p class="brand">
          <a href="../index.html"><span class="logo" aria-hidden="true">B1</span>Kit B1</a>
        </p>
        <nav class="tabs" aria-label="Secciones">
          <a href="../index.html"
            ><svg aria-hidden="true"><use href="../img/icons.svg#plan"></use></svg><span>Plan</span></a
          >
          <a href="../guias/index.html"
            ><svg aria-hidden="true"><use href="../img/icons.svg#guias"></use></svg><span>Guías</span></a
          >
          <a href="../practicar/index.html" aria-current="page"
            ><svg aria-hidden="true"><use href="../img/icons.svg#practicar"></use></svg><span>Practicar</span></a
          >
          <a href="../tarjetas/index.html"
            ><svg aria-hidden="true"><use href="../img/icons.svg#tarjetas"></use></svg><span>Tarjetas</span></a
          >
          <a href="../fallos.html"
            ><svg aria-hidden="true"><use href="../img/icons.svg#fallos"></use></svg><span>Fallos</span
            ><span class="badge" data-stat="mistakes" hidden></span
          ></a>
        </nav>
        <div class="stats">
          <span class="chip" title="Días seguidos practicando"
            ><svg aria-hidden="true"><use href="../img/icons.svg#racha"></use></svg><span class="l">Racha </span
            ><b data-stat="streak">0 días</b></span
          >
          <span class="chip" title="Porcentaje de aciertos"
            ><svg aria-hidden="true"><use href="../img/icons.svg#acierto"></use></svg><span class="l">Acierto </span
            ><b data-stat="accuracy">0%</b></span
          >
          <button type="button" class="themebtn" id="theme" aria-label="Cambiar tema">
            <span class="i-auto"
              ><svg aria-hidden="true"><use href="../img/icons.svg#auto"></use></svg></span
            ><span class="i-light"
              ><svg aria-hidden="true"><use href="../img/icons.svg#sol"></use></svg></span
            ><span class="i-dark"
              ><svg aria-hidden="true"><use href="../img/icons.svg#luna"></use></svg
            ></span>
          </button>
        </div>
      </div>
    </header>
    <div class="wrap">
      <div id="back">
        <a class="back" href="index.html"><span aria-hidden="true">←</span> Practicar</a>
      </div>
      <noscript
        ><p class="noscript">
          Este ejercicio necesita JavaScript. Actívalo en tu navegador y vuelve a cargar la página.
        </p></noscript
      >
      <main class="panel" id="main" tabindex="-1">
        <h1 class="sr-only">Sprint de 60 segundos</h1>
        <section class="quiz" id="sprint">
          <div class="sprint-top">
            <span class="clock" id="clock">60</span
            ><span
              ><svg aria-hidden="true"><use href="../img/icons.svg#rayo"></use></svg> <b id="score">0</b> aciertos</span
            >
          </div>
          <div class="bar"><i id="tbar" style="width: 100%"></i></div>
          <p class="tag" id="sec"></p>
          <p class="sentence" id="sen">
            <span id="pre"></span><span class="blank">&nbsp;</span><span id="post"></span>
          </p>
          <div class="opts" id="opts"></div>
        </section>
        <section class="end" id="result" hidden aria-live="polite">
          <p class="tag">Tiempo</p>
          <p class="big" id="r-score"></p>
          <p id="r-msg"></p>
          <div class="row"><button type="button" class="btn primary" id="again">Otra vez</button></div>
        </section>
      </main>
      <div id="toast" class="toast" role="status" aria-live="polite" hidden>
        <span data-slot="msg"></span><button type="button" class="btn small primary" hidden></button>
      </div>
      <footer class="foot">
        Contenido original para estudiar. Los recursos externos pertenecen a sus autores y se enlazan en su web
        original.
      </footer>
    </div>
    <template id="tpl-opt">
      <button type="button" class="opt">
        <kbd data-slot="key"></kbd><span data-slot="text"></span
        ><span class="i-ok"
          ><svg aria-hidden="true"><use href="../img/icons.svg#acierto-ok"></use></svg></span
        ><span class="i-ko"
          ><svg aria-hidden="true"><use href="../img/icons.svg#fallo-ko"></use></svg
        ></span>
      </button>
    </template>
  </body>
</html>
